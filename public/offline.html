<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Live Chat — offline</title>
    <style>
      html, body { margin: 0; height: 100%; }
      body {
        display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box;
        font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #f6f7f9; color: #23272f; text-align: center;
      }
      button { margin-top: 16px; font: inherit; padding: 10px 18px; border: 0; border-radius: 8px; background: #27b199; color: #fff; }
    </style>
  </head>
  <body>
    <div>
      <p id="offline-message">You're offline. Check your internet connection, then try again.</p>
      <button id="offline-retry" type="button" onclick="location.reload()">Try again</button>
    </div>
    <script>
      (function () {
        var languages = navigator.languages && navigator.languages.length
          ? navigator.languages
          : [navigator.language || ""];
        var locale = "en";
        for (var i = 0; i < languages.length; i += 1) {
          if (/^id(?:[-_]|$)/i.test(languages[i])) { locale = "id"; break; }
          if (/^en(?:[-_]|$)/i.test(languages[i])) { locale = "en"; break; }
        }
        document.documentElement.lang = locale;
        if (locale === "id") {
          document.getElementById("offline-message").textContent = "Anda sedang offline. Periksa koneksi internet, lalu coba lagi.";
          document.getElementById("offline-retry").textContent = "Coba lagi";
        }
      })();
    </script>
  </body>
</html>
