<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="referrer" content="no-referrer" />
    <!--
      No inline script: everything runs from this deployment's own files
      (js/handoff-page.js, built from src/client/page.ts, which then loads
      js/qismo-full-v5.js). Settings come from the URL and are checked there:
        widget.html?baseUrl=<qismo API>&sdkBaseUrl=<SDK API>&iframeUrl=<room host>#t=<invite>
    -->
    <meta http-equiv="Content-Security-Policy" content="script-src 'self'; object-src 'none'; base-uri 'self'" />
    <title>Live Chat</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#27b199" />
    <link rel="icon" type="image/png" sizes="192x192" href="img/pwa/icon-192.png" />
    <link rel="apple-touch-icon" href="img/pwa/apple-touch-icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Live Chat" />
    <script src="js/handoff-page.js" defer></script>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
      }
      #qcw-iframe {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
      }
      #handover-status {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #f6f7f9;
        color: #23272f;
        padding: 24px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="handover-status">Menghubungkan…</div>
  </body>
</html>
