<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="referrer" content="no-referrer" />
    <title>Live Chat</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
      }
      #qcw-iframe {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
      }
      #handover-status {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #f6f7f9;
        color: #23272f;
        padding: 24px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="handover-status">Menghubungkan…</div>
    <script src="https://qismo-stag2.qiscus.io/js/qismo-full-v5.js"></script>
    <script>
      /**
       * Mount the same hosted QismoFull bundle as the Installation Code
       * snippet. The token stays in the URL fragment, never sent in requests.
       *
       * The bundle URL and default API/iframe hosts use staging2 for now;
       * replace qismo-stag2 with the production host after promotion. API and
       * iframe hosts can be overridden from the page_url settings.
       *   https://<worker>/widget.html?baseUrl=...&iframeUrl=...#t=<token>
       */
      var qs = new URLSearchParams(location.search);
      var baseUrl = qs.get("baseUrl") || "https://qismo-stag2.qiscus.io";
      var iframeUrl = qs.get("iframeUrl") || "https://qismo-stag2.qiscus.io";
      var statusEl = document.getElementById("handover-status");

      var PESAN = {
        missing_token: "Link tidak lengkap. Silakan minta link baru lewat WhatsApp.",
        already_used: "Link ini sudah dipakai. Kirim pesan lagi di WhatsApp untuk mendapat link baru.",
        invalid_token: "Link tidak berlaku atau sudah kedaluwarsa. Silakan minta link baru.",
        session_over: "Percakapan ini sudah dilanjutkan di WhatsApp. Silakan cek WhatsApp Anda.",
        too_many_requests: "Terlalu banyak percobaan. Coba lagi sesaat lagi.",
        network_error: "Gagal terhubung ke server. Periksa koneksi Anda dan muat ulang halaman.",
        unknown: "Terjadi kesalahan. Silakan muat ulang halaman.",
      };

      new QismoFull({
        target: document.body,
        props: {
          staging: true,
          options: {
            baseUrl: baseUrl,
            qismoIframeUrl: iframeUrl,
          },
          onEvent: function (event) {
            if (event.event_name === "qiscus:handoff-ready") {
              statusEl.style.display = "none";
            } else if (event.event_name === "qiscus:handoff-error") {
              statusEl.textContent = PESAN[event.code] || PESAN.unknown;
            }
          },
        },
      });

      window.addEventListener("message", function (e) {
        if (!e.data || !e.data.event_name) return;
        console.log("[handover message]", e.data.event_name, e.data.data);
      });
    </script>
  </body>
</html>
