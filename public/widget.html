<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="referrer" content="no-referrer" />
    <title>Live Chat</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#27b199" />
    <link rel="icon" type="image/png" sizes="192x192" href="/img/pwa/icon-192.png" />
    <link rel="apple-touch-icon" href="/img/pwa/apple-touch-icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Live Chat" />
    <script src="/js/push/handoff-push.js"></script>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
      }
      #qcw-iframe {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
      }
      #handover-status {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #f6f7f9;
        color: #23272f;
        padding: 24px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="handover-status">Menghubungkan…</div>
    <script>
      /**
       * Mount the QismoFull bundle served by this same Worker
       * (/js/qismo-full-v5.js, copied from multichannel-frontend). The token
       * stays in the URL fragment, never sent in requests.
       *
       * Production API/iframe hosts are the default. page_url may override:
       *   https://<worker>/widget.html?scriptUrl=...&baseUrl=...&iframeUrl=...#t=<token>
       * The wrapper also passes baseUrl/iframeUrl as QismoFull options so
       * older bundles that do not read the query string still work.
       * Overrides only accept Qiscus hosts, localhost, or (scriptUrl only)
       * this page's own origin; otherwise a crafted link could run foreign JS
       * or send the invite token elsewhere.
       */
      var DEFAULTS = {
        scriptUrl: new URL("/js/qismo-full-v5.js", location.href).href,
        baseUrl: "https://qismo.qiscus.com",
        iframeUrl: "https://omnichannel.qiscus.com",
      };
      var statusEl = document.getElementById("handover-status");

      var PESAN = {
        missing_token: "Link tidak lengkap. Silakan minta link baru lewat WhatsApp.",
        already_used: "Link ini sudah dipakai. Kirim pesan lagi di WhatsApp untuk mendapat link baru.",
        invalid_token: "Link tidak berlaku atau sudah kedaluwarsa. Silakan minta link baru.",
        session_over: "Percakapan ini sudah dilanjutkan di WhatsApp. Silakan cek WhatsApp Anda.",
        too_many_requests: "Terlalu banyak percobaan. Coba lagi sesaat lagi.",
        network_error: "Gagal terhubung ke server. Periksa koneksi Anda dan muat ulang halaman.",
        invalid_script: "Konfigurasi widget tidak valid.",
        session_expired: "Sesi percakapan sudah berakhir. Silakan minta link baru lewat WhatsApp.",
        no_session: "Belum ada percakapan aktif di aplikasi ini.",
        unknown: "Terjadi kesalahan. Silakan muat ulang halaman.",
      };

      // Query override, restricted to Qiscus hosts over HTTPS or localhost;
      // scriptUrl/iframeUrl may also point at this page's own origin (bundle and
      // handoff room served by this Worker).
      // Returns the default when absent, null when present but not allowed.
      function fromQuery(name) {
        var raw = new URLSearchParams(location.search).get(name);
        if (!raw) return DEFAULTS[name];
        try {
          var url = new URL(raw, location.href);
          var host = url.hostname;
          var local = host === "localhost" || host === "127.0.0.1";
          var qiscus = /(^|\.)qiscus\.(com|io)$/.test(host);
          var self = name !== "baseUrl" && url.origin === location.origin;
          if (self || (url.protocol === "https:" && qiscus) || (local && /^https?:$/.test(url.protocol))) {
            return name === "scriptUrl" ? url.href : url.origin;
          }
        } catch (_) {}
        return null;
      }

      // TEMPORARY, local dev only: QismoFull strips #t= from the address bar
      // before exchanging it. Put it back on localhost so a hard refresh can
      // re-exchange the same token (qismo-api answers a reused token within
      // its session window as "resumed") instead of needing a new invite link.
      // Deployed hosts keep the strip-the-token behaviour.
      var isLocal = location.hostname === "localhost" || location.hostname === "127.0.0.1";
      var initialHash = location.hash;

      // Push + resume (public/js/push/handoff-push.js). Optional: if the bundle
      // failed to load, the page behaves exactly as before.
      var push = null;
      var hasInvite = /(^|&)t=/.test(location.hash.slice(1));

      function mount(env) {
        new QismoFull({
          target: document.body,
          props: {
            staging: false,
            options: { baseUrl: env.baseUrl, qismoIframeUrl: env.iframeUrl },
            onEvent: function (event) {
              if (event.event_name === "qiscus:handoff-ready") {
                statusEl.style.display = "none";
                if (push) push.handoffReady();
              } else if (event.event_name === "qiscus:handoff-error") {
                statusEl.textContent = PESAN[event.code] || PESAN.unknown;
                if (push && hasInvite) push.inviteFailed();
              }
            },
          },
        });
        if (isLocal && initialHash && !location.hash) {
          history.replaceState(null, "", location.pathname + location.search + initialHash);
        }
      }

      function startWidget(env) {
        var script = document.createElement("script");
        script.src = env.scriptUrl;
        script.onload = function () {
          if (typeof QismoFull !== "function") {
            statusEl.textContent = PESAN.network_error;
            return;
          }
          mount(env);
        };
        script.onerror = function () {
          statusEl.textContent = PESAN.network_error;
        };
        document.head.appendChild(script);
      }

      var env = {
        scriptUrl: fromQuery("scriptUrl"),
        baseUrl: fromQuery("baseUrl"),
        iframeUrl: fromQuery("iframeUrl"),
      };
      if (!env.scriptUrl || !env.baseUrl || !env.iframeUrl) {
        statusEl.textContent = PESAN.invalid_script;
      } else {
        try {
          push = window.HandoffPush ? window.HandoffPush.start({ iframeUrl: env.iframeUrl }) : null;
        } catch (_) {
          push = null;
        }
        if (hasInvite || !push) {
          // A new invite replaces whoever was signed in on this device.
          if (push) push.beginInvite();
          startWidget(env);
        } else {
          // No invite: resume the stored session (refresh, notification click,
          // Home Screen launch). Never re-uses a consumed token.
          push.resume().then(
            function (session) {
              if (session) {
                push.mountResumeRoom(session, {
                  onReady: function () {
                    statusEl.style.display = "none";
                  },
                  onFailed: function () {
                    statusEl.style.display = "";
                    statusEl.textContent = PESAN.session_expired;
                  },
                });
              } else if (push.offerPasteLink()) {
                statusEl.textContent = PESAN.no_session;
              } else {
                startWidget(env);
              }
            },
            function () {
              startWidget(env);
            },
          );
        }
      }

      window.addEventListener("message", function (e) {
        if (!e.data || !e.data.event_name) return;
        console.log("[handover message]", e.data.event_name, e.data.data);
      });
    </script>
  </body>
</html>
